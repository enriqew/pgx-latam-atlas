target-version = "py311"
line-length = 100
src = ["src", "tests"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "ANN401",  # typing.Any allowed — necessary for pandas/boto3/dynamic dispatch
    "TC003",   # stdlib imports used at runtime, not type-checking only
    "TC004",   # third-party imports used at runtime
]

[lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "T20"]
"notebooks/**" = ["T20", "ANN", "E501"]
"src/glue_jobs/**" = ["ANN", "T20"]
"src/pgx_latam/**" = ["T20"]   # print() is intentional in CLI main() entry points
"src/lambda/**" = ["ANN", "S"] # Lambda deployment artifact — different constraints

[lint.isort]
known-first-party = ["pgx_latam"]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
