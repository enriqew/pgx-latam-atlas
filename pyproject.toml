[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pgx-latam"
version = "0.1.0"
description = "Pharmacogenomic variant frequencies and drug response divergence across Latin American populations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Enrique Redonda", email = "enrique@eredonda.com" }]
keywords = ["pharmacogenomics", "bioinformatics", "latin-america", "1000-genomes", "pharmgkb", "cpic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5",
]
vcf = [
    # pysam requires Linux / macOS / WSL2 on Windows.
    # On Linux (including AWS Glue): pip install ".[vcf]"
    # On Windows: use Docker or WSL2 (see docs/local_dev.md)
    "pysam>=0.22",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "mypy>=1.9",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "boto3-stubs[s3,glue,athena,stepfunctions,secretsmanager,sns]>=1.34",
    "types-requests>=2.31",
    "ipykernel>=6.29",
]

[project.scripts]
pgx-ingest = "pgx_latam.ingestion:main"
pgx-export = "pgx_latam.exports:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pgx_latam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/pgx_latam --cov-report=term-missing --cov-report=xml -m 'not smoke'"
markers = [
    "smoke: marks tests as smoke tests hitting real external URLs (run with '-m smoke')",
    "integration: marks tests requiring AWS credentials (run with '-m integration')",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
exclude = ["src/glue_jobs/"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "boto3.*", "botocore.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/pgx_latam"]
omit = [
    "*/tests/*",
    "src/glue_jobs/*",
    # File I/O utilities — integration-level, not unit-testable without real data
    "*/utils/parquet_io.py",
    "*/utils/athena_runner.py",
    # VCF ingestion — requires pysam + Linux + real remote VCF files
    "*/ingestion/thousand_genomes.py",
    # Orchestrators — wiring only, tested via their sub-functions
    "*/ingestion/__init__.py",
    "*/transformations/__init__.py",
    # Artifact writers — write JSON to disk; integration-level I/O
    "*/exports/*",
]

[tool.coverage.report]
fail_under = 65
show_missing = true
